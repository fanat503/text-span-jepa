# Ablation: random workspace init instead of identity.
#
# The reference model initialises the workspace basis Q to the first D // 10
# canonical directions (`jawk_init: identity`, defaults.yaml). A random
# orthogonal start asks whether the Courant-Fischer term recovers the same
# subspace regardless of where the optimisation begins, or whether the
# identity start is doing the work.
#
# `meta` and `optimization` are declared as empty mappings on purpose: this arm
# must inherit the reference seed/precision and the reference schedule from
# defaults.yaml, and tests/test_v025_integration.py asserts those sections
# exist. An empty mapping is a no-op in `src.train._deep_merge`.
#
# Guard: TestDeltaPurity::test_no_unnecessary_restatements

_meta:
  ablation: jawp_random_init
  description: "JAWP on, jawk_init = random — random orthogonal workspace basis instead of identity"

meta: {}
optimization: {}

model:
  jawk_init: random

logging:
  folder: output/ablations/jawp_random_init/
