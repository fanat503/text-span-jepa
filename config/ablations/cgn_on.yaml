# Ablation: CGN (Contextual Gating Network) ON.
#
# The on-arm of the leave-one-out pair. It is the FULL model: defaults.yaml
# already enables all twelve mechanisms, so "full set plus cgn" is the full
# set. It differs from no_cgn.yaml by exactly one mechanism -- the flag below
# -- and by nothing else that affects which mechanisms are active.
#
# `use_cgn: true` is a deliberate restatement of an all-on default and is one
# of the two documented exceptions to the no-redundant-restatements rule (see
# config/ablations/README.md): it makes this row provably the cgn-on arm by
# inspection, and TestLeaveOneOut::test_on_arm_is_the_full_model proves the
# resolved active set really is all twelve.
#
# `lambda_cgn_ortho` is 0.1, ten times the 0.01 grid weight the full model
# runs every mechanism at, so this arm is a genuine delta rather than a
# restatement of the default. The weight is inert in no_{key}.yaml,
# which is why the pair still isolates exactly one mechanism.
#
# Guards: TestLeaveOneOut::test_on_arm_actually_activates_its_mechanism,
#         TestLeaveOneOut::test_off_on_pair_differs_by_exactly_the_downstream_set

_meta:
  ablation: cgn_on
  description: "On-arm of the cgn pair: the full GWP model"

model:
  use_cgn: true
  lambda_cgn_ortho: 0.1

logging:
  folder: output/ablations/cgn_on/
