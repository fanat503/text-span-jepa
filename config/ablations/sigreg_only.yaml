# Ablation: SIGReg replaces VICReg.
#
# Collapse prevention is the one thing the objective must not lose, so this arm
# swaps the VICReg variance/covariance terms for SIGReg (LeJEPA, 2025) — a
# single-hyperparameter isotropic-Gaussian regulariser — while keeping the
# mechanisms that are independent of the collapse-preventer. Compared with
# none.yaml this keeps JAWP; compared with the full model it removes the other
# eleven mechanisms and the two VICReg terms.
#
# `meta` and `optimization` are declared as empty mappings on purpose: this arm
# must inherit the reference seed/precision and the reference schedule from
# defaults.yaml, and tests/test_v025_integration.py asserts those sections
# exist. An empty mapping is a no-op in `src.train._deep_merge`.
#
# Guard: TestDeltaPurity::test_no_unnecessary_restatements

_meta:
  ablation: sigreg_only
  description: "JAWP with SIGReg as the only collapse preventer; no VICReg variance/covariance terms"

meta: {}
optimization: {}

model:
  use_cgn: false
  # `lambda_swip` is zeroed next to the flag: any config that names a
  # mechanism must name its weight (tests/test_swip.py asserts this for
  # SWIP; no other mechanism has such a test yet). Inert today — with
  # `use_swip: false` the module is never constructed — and it stops a later
  # edit that flips the flag back from silently enabling SWIP at 0.01.

  use_swip: false
  lambda_swip: 0.0
  use_pcr: false
  use_spc: false
  use_wsd: false
  use_cmc: false
  use_gac: false
  use_sta: false
  use_puc: false
  use_rdc: false
  use_wsr: false
  lambda_sigreg: 0.1
  lambda_variance: 0.0
  lambda_covariance: 0.0

logging:
  folder: output/ablations/sigreg_only/
