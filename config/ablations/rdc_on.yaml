# Ablation: RDC (Representation Drift Compensation) ON.
#
# The on-arm of the leave-one-out pair. It is the FULL model: defaults.yaml
# already enables all twelve mechanisms, so "full set plus rdc" is the full
# set. It differs from no_rdc.yaml by exactly one mechanism -- the flag below
# -- and by nothing else that affects which mechanisms are active.
#
# DEPENDENCY: RDC (Representation Drift Compensation) reads the JAWP workspace, and
# `TextSpanJEPA.__init__` builds it only when `use_jawp` is also true. A row
# that turns use_rdc off while JAWP is off is not a one-mechanism ablation,
# and a row that turns use_rdc on while JAWP is off trains with it silently
# disabled. The leave-one-out grid never does either.
#
# `use_rdc: true` is a deliberate restatement of an all-on default and is one
# of the two documented exceptions to the no-redundant-restatements rule (see
# config/ablations/README.md): it makes this row provably the rdc-on arm by
# inspection, and TestLeaveOneOut::test_on_arm_is_the_full_model proves the
# resolved active set really is all twelve.
#
# `lambda_rdc` is 0.1, ten times the 0.01 grid weight the full model
# runs every mechanism at, so this arm is a genuine delta rather than a
# restatement of the default. The weight is inert in no_{key}.yaml,
# which is why the pair still isolates exactly one mechanism.
#
# Guards: TestLeaveOneOut::test_on_arm_actually_activates_its_mechanism,
#         TestLeaveOneOut::test_off_on_pair_differs_by_exactly_the_downstream_set

_meta:
  ablation: rdc_on
  description: "On-arm of the rdc pair: the full GWP model"

model:
  use_rdc: true
  lambda_rdc: 0.1

logging:
  folder: output/ablations/rdc_on/
