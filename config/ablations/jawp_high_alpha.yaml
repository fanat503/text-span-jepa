# Ablation: strong predictor focus (alpha = 1.0, ten times the reference 0.1).
#
# The other end of the jawk_alpha sweep from jawp_alpha_0.yaml. Reference value
# is 0.1 (defaults.yaml); 0.0 and 1.0 bracket it at the two extremes, so the
# three arms together answer "does the Courant-Fischer term need tuning, and
# which direction".
#
# `meta` and `optimization` are declared as empty mappings on purpose: this arm
# must inherit the reference seed/precision and the reference schedule from
# defaults.yaml, and tests/test_v025_integration.py asserts those sections
# exist. An empty mapping is a no-op in `src.train._deep_merge`.
#
# Guard: TestDeltaPurity::test_no_unnecessary_restatements

_meta:
  ablation: jawp_high_alpha
  description: "JAWP on, jawk_alpha = 1.0 — ten times the reference focus penalty"

meta: {}
optimization: {}

model:
  jawk_alpha: 1.0

logging:
  folder: output/ablations/jawp_high_alpha/
