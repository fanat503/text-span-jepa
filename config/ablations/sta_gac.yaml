# Ablation: STA + GAC, the capacity/stability pair.
#
# GAC allocates gradient budget to starved directions; STA keeps the workspace
# spectrum from drifting while that budget is being moved around. The two act
# on the same subspace at the same time, so their single-mechanism rows cannot
# separate "STA alone" from "STA plus a moving capacity allocation".
#
# Both members are at 10x the reference grid weight (0.1 vs 0.01) so the
# interaction is not swamped by the other ten mechanisms, and so the arm is a
# genuine delta on the full model rather than a restatement of it.
#
# Guard: TestDeltaPurity::test_no_unnecessary_restatements

_meta:
  ablation: sta_gac
  description: "STA + GAC at 10x weight — spectral stabilisation under moving gradient allocation"

model:
  lambda_sta: 0.1
  lambda_gac: 0.1

logging:
  folder: output/ablations/sta_gac/
