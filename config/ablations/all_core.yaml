# Ablation: the full GWP model — all twelve mechanisms ON.
#
# The reference row of every table in the paper. `defaults.yaml` already
# enables every mechanism in `MechanismBundle.ALL_MECHANISMS` with the uniform
# grid loss weight of 0.01, so this file carries no model delta at all: it
# exists to name the row, attach the provenance, and give the run its own
# output folder. Copying the twelve flags here would create a second place to
# update when the mechanism set changes, which is exactly the failure mode
# that made the pre-fix `all_core.yaml` a near-verbatim copy of defaults.yaml.
#
# For the mechanism-level table use the leave-one-out pair instead:
#   no_<mech>.yaml  -- the full model minus one mechanism
#   <mech>_on.yaml  -- the full model (this row, under a per-mechanism name)
#
# Guards: TestLeaveOneOut::test_on_arm_is_the_full_model,
#         TestDeltaPurity::test_no_unnecessary_restatements

_meta:
  ablation: all_core
  description: "Full GWP model: all twelve mechanisms at the reference grid weight (inherited from defaults.yaml)"

logging:
  folder: output/ablations/all_core/
