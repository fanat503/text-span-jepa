# Ablation: future prediction off — span loss only.
#
# Isolates the multi-horizon term of the objective: `lambda_future` goes to
# zero and the warmup ramp is disabled so the loss is identically zero from
# step 0 rather than ramping in. Everything else, including all twelve
# mechanisms, is the full model.
#
# `meta` and `optimization` are declared as empty mappings on purpose: this arm
# must inherit the reference seed/precision and the reference schedule from
# defaults.yaml, and tests/test_v025_integration.py asserts those sections
# exist. An empty mapping is a no-op in `src.train._deep_merge`.
#
# Guard: TestDeltaPurity::test_no_unnecessary_restatements

_meta:
  ablation: no_future_loss
  description: "Future prediction off (lambda_future = 0, no warmup) — span loss only"

meta: {}
optimization: {}

model:
  lambda_future: 0.0
  future_warmup_steps: 0

logging:
  folder: output/ablations/no_future_loss/
