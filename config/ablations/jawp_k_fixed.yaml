# Ablation: no workspace-rank curriculum (k pinned to D // 10).
#
# `defaults.yaml` grows the workspace from k_start = 1 to k_end = D // 10 on a
# cosine ramp over `jawk_curriculum_steps`. The reference shape is 768d, so
# D // 10 = 76. This arm starts there and stays there, isolating the curriculum
# from the final subspace dimension.
#
# `meta` and `optimization` are declared as empty mappings on purpose: this arm
# must inherit the reference seed/precision and the reference schedule from
# defaults.yaml, and tests/test_v025_integration.py asserts those sections
# exist. An empty mapping is a no-op in `src.train._deep_merge`.
#
# NOTE: 76 is D // 10 for the 768d reference model in defaults.yaml. If the
# reference width ever changes, this number must change with it.
#
# Guard: TestDeltaPurity::test_no_unnecessary_restatements

_meta:
  ablation: jawp_k_fixed
  description: "JAWP on, k_start = k_end = 76 = D // 10 for the 768d reference model — no rank curriculum"

meta: {}
optimization: {}

model:
  jawk_k_start: 76
  jawk_k_end: 76

logging:
  folder: output/ablations/jawp_k_fixed/
