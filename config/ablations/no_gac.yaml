# Ablation: GAC (Gradient-Allocated Capacity) OFF.
#
# Row of the leave-one-out table: the full GWP model (defaults.yaml) minus
# exactly one mechanism. Everything else -- architecture, schedule, effective
# batch, the other eleven mechanisms -- is inherited, so this file changes
# nothing but this mechanism and the row cannot drift out of comparability.
#
# Pair with gac_on.yaml, which is the full model. The pair therefore differs
# by exactly one mechanism.
#
# `lambda_gac` is zeroed as well as the flag: any config that names a
# mechanism must name its weight (tests/test_swip.py asserts this for
# SWIP; the other mechanisms have no such test yet). With the flag off
# the module is never constructed and the weight is never read, so this
# is belt-and-braces -- it stops a later edit that flips the flag back
# from silently switching the mechanism on at the grid weight.
#
# Guards, all in tests/test_config_system.py:
#   TestLeaveOneOut::test_no_arm_is_full_set_minus_exactly_what_its_flag_removes
#   TestLeaveOneOut::test_off_on_pair_differs_by_exactly_the_downstream_set
#   TestLeaveOneOut::test_no_arm_never_collapses_to_the_none_baseline
#   TestLeaveOneOut::test_no_arm_differs_from_the_full_model_only_in_its_keys

_meta:
  ablation: no_gac
  description: "Leave-one-out: GAC (Gradient-Allocated Capacity) disabled, the other eleven enabled"

model:
  use_gac: false
  lambda_gac: 0.0

logging:
  folder: output/ablations/no_gac/
