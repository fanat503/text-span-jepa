# Ablation: STA + WSR, the pair the Grassmann Sharpness Decomposition couples.
#
# proofs/wsr.md decomposes the workspace sharpness as
#   rho_Q = rho_spectral + rho_directional
# with STA bounding the spectral part and WSR bounding the directional part.
# Neither single-mechanism row (no_sta.yaml, no_wsr.yaml) can show that the two
# bounds compose, because each of those is measured against the full model with
# the *other* term still present.
#
# Both members are at 10x the reference grid weight (0.1 vs 0.01) so the
# interaction is not swamped by the other ten mechanisms, and so the arm is a
# genuine delta on the full model rather than a restatement of it.
#
# Guard: TestDeltaPurity::test_no_unnecessary_restatements

_meta:
  ablation: sta_wsr
  description: "STA + WSR at 10x weight — spectral and directional sharpness bounds together"

model:
  lambda_sta: 0.1
  lambda_wsr: 0.1

logging:
  folder: output/ablations/sta_wsr/
