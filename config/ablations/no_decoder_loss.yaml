# Ablation: decoder (token-space) loss off — purely latent prediction.
#
# This is the load-bearing claim of a JEPA: with `lambda_decoder = 0` the model
# receives no token-space signal at all and must predict in latent space. All
# twelve mechanisms stay on.
#
# `meta` and `optimization` are declared as empty mappings on purpose: this arm
# must inherit the reference seed/precision and the reference schedule from
# defaults.yaml, and tests/test_v025_integration.py asserts those sections
# exist. An empty mapping is a no-op in `src.train._deep_merge`.
#
# Guard: TestDeltaPurity::test_no_unnecessary_restatements

_meta:
  ablation: no_decoder_loss
  description: "Token-space decoder loss off (lambda_decoder = 0) — purely latent prediction"

meta: {}
optimization: {}

model:
  lambda_decoder: 0.0

logging:
  folder: output/ablations/no_decoder_loss/
