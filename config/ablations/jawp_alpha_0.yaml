# Ablation: JAWP's predictor-focus penalty removed (alpha = 0).
#
# The workspace Q is still learned and still defines the prediction subspace,
# but nothing pushes the predictor to concentrate its capacity inside it. This
# isolates the Courant-Fischer term from the subspace choice itself.
#
# `meta` and `optimization` are declared as empty mappings on purpose: this arm
# must inherit the reference seed/precision and the reference schedule from
# defaults.yaml, and tests/test_v025_integration.py asserts those sections
# exist. An empty mapping is a no-op in `src.train._deep_merge`.
#
# Guard: TestDeltaPurity::test_no_unnecessary_restatements

_meta:
  ablation: jawp_alpha_0
  description: "JAWP on, jawk_alpha = 0 — workspace chosen but no predictor-focus penalty"

meta: {}
optimization: {}

model:
  jawk_alpha: 0.0

logging:
  folder: output/ablations/jawp_alpha_0/
