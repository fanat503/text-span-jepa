# Ablation: JAWP (Jacobian-Aligned Workspace Prediction) ON.
#
# The on-arm of the leave-one-out pair. It is the FULL model: defaults.yaml
# already enables all twelve mechanisms, so "full set plus jawp" is the full
# set. It differs from no_jawp.yaml by exactly one mechanism -- the flag below
# -- and by nothing else that affects which mechanisms are active.
#
# `use_jawp: true` is a deliberate restatement of an all-on default and is one
# of the two documented exceptions to the no-redundant-restatements rule (see
# config/ablations/README.md): it makes this row provably the jawp-on arm by
# inspection, and TestLeaveOneOut::test_on_arm_is_the_full_model proves the
# resolved active set really is all twelve.
#
# JAWP (Jacobian-Aligned Workspace Prediction) has no loss weight of its own (it is a module, not a
# regulariser), so this arm is the full model verbatim. Its
# hyperparameter sweeps are the separate jawp_* / jawp_pcr configs.
#
# Guards: TestLeaveOneOut::test_on_arm_actually_activates_its_mechanism,
#         TestLeaveOneOut::test_off_on_pair_differs_by_exactly_the_downstream_set

_meta:
  ablation: jawp_on
  description: "On-arm of the jawp pair: the full GWP model"

model:
  use_jawp: true

logging:
  folder: output/ablations/jawp_on/
