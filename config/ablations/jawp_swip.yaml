# Ablation: JAWP workspace with a strong SWIP term.
#
# SWIP's information-preservation term is the one that constrains how much of
# the token information survives the projection into the JAWP workspace, so
# this arm asks whether the full model's SWIP weight (0.01) is doing any work
# next to the predictor's own span/future losses. 10x the reference weight.
#
# Guard: TestDeltaPurity::test_no_unnecessary_restatements

_meta:
  ablation: jawp_swip
  description: "JAWP + SWIP at 10x weight — information preservation across the workspace projection"

model:
  lambda_swip: 0.1

logging:
  folder: output/ablations/jawp_swip/
