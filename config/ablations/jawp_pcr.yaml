# Ablation: PCR from step 0, with no warmup.
#
# PCR has no loss weight of its own — it is a cascade of refinement blocks, not
# a regulariser — so a weight sweep on it is not expressible and the only knob
# with a defensible alternative value is `pcr_warmup_steps`. The reference
# delays the cascade by 1000 steps (defaults.yaml); this arm engages it
# immediately, which is the interesting regime for the Cascade Capacity theorem
# because the bottleneck is widest exactly when the cascade starts.
#
# The per-mechanism arms for PCR are pcr_on.yaml / no_pcr.yaml.
#
# Guard: TestDeltaPurity::test_no_unnecessary_restatements

_meta:
  ablation: jawp_pcr
  description: "JAWP + PCR with no cascade warmup (pcr_warmup_steps = 0) — cascade active from step 0"

model:
  pcr_warmup_steps: 0

logging:
  folder: output/ablations/jawp_pcr/
