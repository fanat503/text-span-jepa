# Ablation: CGN + SPC, the routing pair.
#
# Both are in MechanismBundle.GROUPS["routing"]: CGN decides *where* information
# flows and SPC decides *how much* capacity each frequency band gets. They are
# the two members of the group that have independent loss terms, so their
# interaction is the routing group's internal claim; the other two group
# members (SWIP, PCR) have their own arms.
#
# Both members are at 10x the reference grid weight (0.1 vs 0.01). CGN's weight
# is the partition-of-unity orthogonality term `lambda_cgn_ortho`, which is
# separate from the mechanism's own gate.
#
# Guard: TestDeltaPurity::test_no_unnecessary_restatements

_meta:
  ablation: cgn_spc
  description: "CGN + SPC at 10x weight — the routing group's two independent loss terms together"

model:
  lambda_cgn_ortho: 0.1
  lambda_spc: 0.1

logging:
  folder: output/ablations/cgn_spc/
