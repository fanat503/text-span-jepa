# Ablation: PUC + RDC, the uncertainty/compensation pair.
#
# PUC calibrates prediction confidence; RDC compensates the representation drift
# that mis-calibration accumulates. proofs/puc.md and proofs/rdc.md both take
# the workspace as input, so both are inert unless JAWP is on — which it is,
# since this is a delta on the full model.
#
# Both members are at 10x the reference grid weight (0.1 vs 0.01) so the
# interaction is not swamped by the other ten mechanisms, and so the arm is a
# genuine delta on the full model rather than a restatement of it.
#
# Guard: TestDeltaPurity::test_no_unnecessary_restatements

_meta:
  ablation: puc_rdc
  description: "PUC + RDC at 10x weight — uncertainty calibration under representation drift"

model:
  lambda_puc: 0.1
  lambda_rdc: 0.1

logging:
  folder: output/ablations/puc_rdc/
