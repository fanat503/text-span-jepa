# Ablation: predictive rank regularisation on.
#
# `lambda_predictive_rank` is 0.0 in `defaults.yaml`: the full model does not
# constrain the rank of the workspace beyond what JAWP's own loss implies. This
# arm adds the explicit anti-rank-collapse term, so the comparison against
# all_core.yaml isolates that term and nothing else.
#
# Not part of the leave-one-out grid: ALL_MECHANISMS has 12 entries and
# predictive rank is not one of them (it is a regulariser on JAWP, not a
# twelfth-plus-one mechanism). Adding it there would break the "one flag per
# row" invariant the grid tests pin.
#
# Guard: TestDeltaPurity::test_no_unnecessary_restatements

_meta:
  ablation: predictive_rank_on
  description: "JAWP + explicit predictive rank regularisation (lambda_predictive_rank = 0.01)"

model:
  lambda_predictive_rank: 0.01

logging:
  folder: output/ablations/predictive_rank_on/
