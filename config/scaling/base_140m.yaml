# Capacity rung 3 of 4: base (claimed 140M).
#
# This rung is dimensionally identical to the reference model in
# defaults.yaml (768 / 12 / 12, predictor 384 x 6), which is deliberate: the
# ablation table and this rung are then the same network, so the two studies
# share a model. The file exists to give the rung a name, an output folder and
# the standard-JEPA arm.
#
# The ladder in config/scaling/ is a CAPACITY sweep. Every hyperparameter except
# width and depth is inherited from defaults.yaml, so the four rungs see the
# same number of tokens in the same number of optimizer steps at the same
# learning rate, and the only thing that moves is how many parameters there are.
# The pre-fix ladder moved effective batch (two tiers of two points), epochs,
# lr, num_refine_steps, drop_path_rate and the mechanism curricula along with
# size, which made a two-point-per-group curve unable to separate capacity from
# anything else.
#
# Arm: standard JEPA. This ladder measures how the base architecture scales, so
# the mechanism set is held fixed at JAWP-only and the GWP study is left to the
# leave-one-out table in config/ablations/. The eleven `use_*: false` lines are
# therefore a real delta, not a copy of a default: defaults.yaml is the FULL
# GWP model, and a config that means to be a baseline says so out loud.
#
# Parameter counts, measured in-process with this file exactly as it resolves
# (GPT-2 vocab 50304, max_seq_len 512, all mechanisms as declared):
#   total parameters     : 262,021,633
#   trainable parameters : 137,938,945   <- what the filename claims (~140M)
#   get_num_params()     :  98,853,889
# `get_num_params()` excludes the target encoder and both embeddings, so the
# number the trainer logs at startup under-reports the true total by ~2.5x.
# That is a `src/models/jepa.py` issue, not a config issue.
#
# Guard: TestScalingLadder, TestScalingParamCounts

_meta:
  config: base_140m
  arm: standard_jepa
  note: "width/depth only; identical to the defaults.yaml reference shape. The schedule, the effective batch and the mechanism set are inherited"

meta:
  model_name: text_span_jepa_base

model:
  # The five shape keys are restated on purpose. They ARE this rung's
  # experiment variable, and a capacity ladder whose middle rung has no
  # dimensions in its own file is unreadable in a paper appendix.
  # tests/test_v025_integration.py also reads them unmerged, so they must be
  # here. This is the one documented exception to the no-redundant-restatements
  # rule for this directory; every other key is inherited.
  embed_dim: 768
  encoder_depth: 12
  num_heads: 12
  predictor_embed_dim: 384
  predictor_depth: 6

  use_cgn: false
  # `lambda_swip` is zeroed next to the flag: any config that names a
  # mechanism must name its weight (tests/test_swip.py asserts this for
  # SWIP; no other mechanism has such a test yet). Inert today — with
  # `use_swip: false` the module is never constructed — and it stops a later
  # edit that flips the flag back from silently enabling SWIP at 0.01.

  use_swip: false
  lambda_swip: 0.0
  use_pcr: false
  use_spc: false
  use_wsd: false
  use_cmc: false
  use_gac: false
  use_sta: false
  use_puc: false
  use_rdc: false
  use_wsr: false

logging:
  folder: output/scaling/base-140m/
