# Capacity rung 4 of 4: large (claimed 300M).
#
# The ladder in config/scaling/ is a CAPACITY sweep. Every hyperparameter except
# width and depth is inherited from defaults.yaml, so the four rungs see the
# same number of tokens in the same number of optimizer steps at the same
# learning rate, and the only thing that moves is how many parameters there are.
#
# Two things this rung used to do, and no longer does, because both confound a
# capacity curve:
#   * lr 5e-4 instead of the reference 1e-3. Holding lr fixed across a 2.7x
#     width range measures "size and lr" jointly. A proper parametric-scaling
#     (muP) study is a different experiment and belongs in its own family; it
#     is not this ladder.
#   * drop_path_rate 0.15 instead of 0.1, and a 15000-step JAWP curriculum
#     instead of 10000. Regularisation and curriculum length are held fixed
#     across the ladder so the curve is capacity.
#
# Arm: standard JEPA. This ladder measures how the base architecture scales, so
# the mechanism set is held fixed at JAWP-only and the GWP study is left to the
# leave-one-out table in config/ablations/. The eleven `use_*: false` lines are
# therefore a real delta, not a copy of a default: defaults.yaml is the FULL
# GWP model, and a config that means to be a baseline says so out loud.
#
# Parameter counts, measured in-process with this file exactly as it resolves
# (GPT-2 vocab 50304, max_seq_len 512, all mechanisms as declared):
#   total parameters     : 537,990,145
#   trainable parameters : 284,412,929
#   non-embedding        : 433,918,977
#   get_num_params()     : 537,990,145   (= the total; what the trainer logs)
# The FILENAME tracks TRAINABLE parameters, not total: it claims ~300M against
# a measured 284,412,929 trainable (-5.2%). The TOTAL is 1.79x the claimed
# figure because `target_encoder` is an exact `deepcopy` of `encoder`
# (253,577,216 frozen parameters, 47.1% of the model) and both encoders carry
# a GPT-2-sized embedding table. Budget MEMORY against the total: this rung
# needs 2.00 GiB of fp32 weights plus ~2.12 GiB of AdamW m/v state over the
# trainable set. `src/train.py` logs the total and the trainable count on
# adjacent lines.
#
# NOTE: this is the widest rung and is the one config that must never be used
# as a local validation step — see AGENTS.md.
#
# Guard: TestScalingLadder, TestScalingParamCounts
#
# REPRODUCIBILITY: this file pins nothing about the machine the rung is run on,
# and no config key can. `src/train.py` calls `seed_everything(seed)`, so the
# intra-op thread count comes from whatever OMP/the launcher left, and the rung
# is then only reproducible on a box with that same count. Measured
# (`src/utils/seed.py`, `.agent-notes/task-24.md`): 1 vs 2 threads, same seed,
# same data, 10 steps -> steps 0-2 bitwise equal, steps 3-9 differ by up to
# 2.4e-07, final `qkv` weight not bitwise equal. A capacity curve therefore
# cannot be re-derived bit-for-bit on a different machine unless determinism is
# requested explicitly:
#
#   TEXT_SPAN_JEPA_DETERMINISTIC=1 python -m src.train --fname <this file>
#
# and `reproducibility_state()` should be logged next to the seed, because a
# checkpoint does not carry its own thread count. The config key that would do
# this properly is deliberately not declared -- see the `meta:` block of
# defaults.yaml for the reasoning and the exact one-line `src/train.py` change.

_meta:
  config: large_300m
  arm: standard_jepa
  note: "width/depth only; lr, drop_path_rate and the mechanism curricula are held at the reference values"

meta:
  model_name: text_span_jepa_large

model:
  embed_dim: 1024
  encoder_depth: 16
  num_heads: 16
  predictor_embed_dim: 512
  predictor_depth: 8

  use_cgn: false
  # `lambda_swip` is zeroed next to the flag: any config that names a
  # mechanism must name its weight (tests/test_swip.py asserts this for
  # SWIP; no other mechanism has such a test yet). Inert today — with
  # `use_swip: false` the module is never constructed — and it stops a later
  # edit that flips the flag back from silently enabling SWIP at 0.01.

  use_swip: false
  lambda_swip: 0.0
  use_pcr: false
  use_spc: false
  use_wsd: false
  use_cmc: false
  use_gac: false
  use_sta: false
  use_puc: false
  use_rdc: false
  use_wsr: false

logging:
  folder: output/scaling/large-300m/
