# Fixed model size, 2 devices: micro-batch 256, global effective batch 512.
#
# `config/scaling/` holds two families and they answer different questions:
#
#   config/scaling/*.yaml     CAPACITY ladder. Model size varies; the effective
#                             batch, the schedule and the mechanism set are
#                             held fixed. Answers "what does width/depth buy".
#   config/scaling/devices/*.yaml THROUGHPUT ladder. Model size is pinned to the
#                             defaults.yaml reference shape; the per-device
#                             micro-batch is the sweep axis. Answers "what does
#                             a wider machine buy".
#
# `optimization.grad_accum_steps` is pinned to 1 across the family, so the
# global effective batch stays at 512 sequences (262,144 tokens) and therefore
# the number of optimizer steps per epoch stays identical. Only the number of
# devices the micro-batch is split across changes, so a run measures scaling
# efficiency and nothing else.
#
# Device count is a LAUNCHER argument, not a config key: the TPU/DDP side of
# this repo is not built yet and this file deliberately does not invent a flag
# for it. Invoke with whatever your launcher takes, e.g.
#   torchrun --nproc_per_node=2 -m src.train --fname config/scaling/devices/dev2_bs256.yaml
# `data.batch_size` is the PER-DEVICE micro-batch: 2 x 256 = 512.
#
# Guard: TestFixedSizeDistributedFamily

_meta:
  config: devices_dev2_bs256
  devices: 2
  per_device_micro_batch: 256
  global_effective_batch: 512
  note: "model size fixed at the defaults.yaml reference shape; only the per-device micro-batch varies across this family"

data:
  batch_size: 256

optimization:
  grad_accum_steps: 1

logging:
  folder: output/scaling/devices/dev2-bs256/
