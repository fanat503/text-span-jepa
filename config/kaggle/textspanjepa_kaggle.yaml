# Text-Span JEPA -- Kaggle T4 profile, base dimensions, WikiText-103.
#
# Hardware profile: a single 16 GB T4 cannot hold the reference micro-batch, so
# this config halves the micro-batch and doubles the accumulation
# (32 x 16 = 512 sequences — the same effective batch as every other config in
# the repo, so the Kaggle run is comparable to a workstation run).
#
# Arm: standard JEPA, same as the rest of the non-ablation configs. See
# config/scaling/base_140m.yaml for why the eleven `use_*: false` lines are
# written out rather than omitted.
#
# The pre-fix version of this file set `ema_tau_end: 1.0`, which
# `TextSpanJEPAConfig.validate()` rejects and which freezes the target encoder.
# The endpoint is now declared once, in defaults.yaml.
#
# Guard: TestEveryConfigRuns, TestDeltaPurity, TestEMATargetStillMoves

_meta:
  config: textspanjepa_kaggle
  arm: standard_jepa
  hardware: "single Kaggle T4 (16 GB)"
  note: "reference shape inherited from defaults.yaml; micro-batch halved, accumulation doubled, effective batch unchanged"

meta:
  model_name: text_span_jepa_kaggle

data:
  batch_size: 32
  root_path: /kaggle/input/wikitext-103

model:
  use_cgn: false
  # `lambda_swip` is zeroed next to the flag: any config that names a
  # mechanism must name its weight (tests/test_swip.py asserts this for
  # SWIP; no other mechanism has such a test yet). Inert today — with
  # `use_swip: false` the module is never constructed — and it stops a later
  # edit that flips the flag back from silently enabling SWIP at 0.01.

  use_swip: false
  lambda_swip: 0.0
  use_pcr: false
  use_spc: false
  use_wsd: false
  use_cmc: false
  use_gac: false
  use_sta: false
  use_puc: false
  use_rdc: false
  use_wsr: false

optimization:
  grad_accum_steps: 16

logging:
  folder: /kaggle/working/output/
