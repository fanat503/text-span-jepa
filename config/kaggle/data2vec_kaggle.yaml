# data2vec baseline -- Kaggle T4 profile, base dimensions, WikiText-103.
#
# Dims and schedule follow the data2vec column
# (config/wikitext/data2vec_wikitext_*.yaml); the hardware profile follows
# config/kaggle/textspanjepa_kaggle.yaml: micro-batch 32 x accumulation 16 =
# 512 sequences, the same effective batch every other config in the repo uses.
#
# `src.train.create_model` dispatches model_name=data2vec to
# `Data2VecTextBaseline` and never builds a `TextSpanJEPAConfig`, so every GWP
# mechanism key and `predictor_embed_dim` that used to sit in this file were
# silently inert. They are gone. The baseline's own EMA lives in
# model.ema_decay / model.ema_end_decay / model.ema_anneal_end_step, which are
# declared once in defaults.yaml because all four data2vec rungs use the same
# values.
#
# Guard: TestEveryConfigRuns, TestDeltaPurity

_meta:
  config: data2vec_kaggle
  arm: baseline_data2vec
  hardware: "single Kaggle T4 (16 GB)"
  note: "data2vec column schedule; reference shape inherited from defaults.yaml"

meta:
  model_name: data2vec_kaggle

data:
  batch_size: 32
  root_path: /kaggle/input/wikitext-103
  mask_ratio: 0.15
  span_length_range: [1, 1]

model:
  drop_rate: 0.1

optimization:
  grad_accum_steps: 16
  lr: 0.0005
  start_lr: 0.0001
  weight_decay: 0.01
  final_weight_decay: 0.01

logging:
  folder: /kaggle/working/output/
