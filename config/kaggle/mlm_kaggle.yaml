# MLM baseline -- Kaggle T4 profile, base dimensions, WikiText-103.
#
# Dims and schedule follow the MLM column (config/wikitext/mlm_wikitext_*.yaml);
# the hardware profile follows config/kaggle/textspanjepa_kaggle.yaml:
# micro-batch 32 x accumulation 16 = 512 sequences, the same effective batch
# every other config in the repo uses.
#
# `src.train.create_model` dispatches model_name=mlm to `MLMBaseline` and never
# builds a `TextSpanJEPAConfig`, so every GWP mechanism key, the EMA keys and
# `predictor_embed_dim` that used to sit in this file were silently inert. They
# are gone.
#
# Guard: TestEveryConfigRuns, TestDeltaPurity

_meta:
  config: mlm_kaggle
  arm: baseline_mlm
  hardware: "single Kaggle T4 (16 GB)"
  note: "MLM column schedule; micro-batch halved, accumulation doubled, effective batch unchanged"

meta:
  model_name: mlm_kaggle

data:
  batch_size: 32
  root_path: /kaggle/input/wikitext-103
  mask_ratio: 0.15
  span_length_range: [1, 1]

model:
  drop_rate: 0.1

optimization:
  grad_accum_steps: 16
  epochs: 30
  lr: 0.0005
  start_lr: 0.0001
  weight_decay: 0.01
  final_weight_decay: 0.01

logging:
  folder: /kaggle/working/output/
