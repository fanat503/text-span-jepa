# Text-Span JEPA -- TinyStories, 640/10/10 rung.
#
# TinyStories is roughly two orders of magnitude smaller than WikiText-103, so
# this config shortens the run rather than inheriting the reference schedule:
# 20 epochs instead of 50, 5 warmup epochs instead of 10, and a 2000-step
# future-loss warmup instead of 5000. The effective batch stays at the reference
# 512 sequences (128 x 4), because the point of this config is fast iteration
# on a small corpus, not a different optimisation regime.
#
# KNOWN GAP (src/, not config): `src.train._build_data_pipeline` hard-codes
# `load_wikitext103(...)` and passes `data.root_path` to it, so this config will
# load WikiText-103 text out of the TinyStories directory. Loading TinyStories
# needs a dataset switch in `src/train.py`; the config declares the intent
# (`meta.dataset` and `data.root_path`) and cannot implement it.
#
# Arm: standard JEPA, matching the rest of the non-ablation configs. The
# pre-fix version of this file set `ema_tau_end: 1.0`, which
# `TextSpanJEPAConfig.validate()` rejects and which freezes the target encoder.
#
# Guard: TestEveryConfigRuns, TestDeltaPurity, TestEMATargetStillMoves

_meta:
  config: textspanjepa_tinystories
  arm: standard_jepa
  note: "small corpus: shorter schedule; known src/ gap -- the trainer hard-codes load_wikitext103"

meta:
  model_name: text_span_jepa_small
  dataset: tinystories

data:
  batch_size: 128
  root_path: data/tinystories

model:
  embed_dim: 640
  encoder_depth: 10
  num_heads: 10
  predictor_embed_dim: 320
  predictor_depth: 4

  use_cgn: false
  # `lambda_swip` is zeroed next to the flag: any config that names a
  # mechanism must name its weight (tests/test_swip.py asserts this for
  # SWIP; no other mechanism has such a test yet). Inert today — with
  # `use_swip: false` the module is never constructed — and it stops a later
  # edit that flips the flag back from silently enabling SWIP at 0.01.

  use_swip: false
  lambda_swip: 0.0
  use_pcr: false
  use_spc: false
  use_wsd: false
  use_cmc: false
  use_gac: false
  use_sta: false
  use_puc: false
  use_rdc: false
  use_wsr: false
  future_warmup_steps: 2000

optimization:
  epochs: 20
  warmup: 5
  grad_accum_steps: 4

logging:
  folder: output/tinystories/small-100m/
