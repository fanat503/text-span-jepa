# Text-Span JEPA -- WikiText-103, base rung (capacity-matched to
# config/scaling/base_140m.yaml and to the ablation table's reference model).
#
# The shape here is the defaults.yaml reference shape, so this config declares
# no dimensions at all; it declares the standard-JEPA arm, the name and the
# output folder.
#
# Arm: standard JEPA. defaults.yaml is the FULL GWP model, so "plain JEPA" is
# always eleven explicit `use_*: false` lines rather than an omission: a config
# that means to be a baseline says so out loud. The mechanism study is
# config/ablations/; this file is the capacity study.
#
# The pre-fix version of this file set `ema_tau_end: 1.0`, which
# `TextSpanJEPAConfig.validate()` rejects and which freezes the target encoder.
# The endpoint is now declared once, in defaults.yaml.
#
# Guard: TestEveryConfigRuns, TestDeltaPurity, TestEMATargetStillMoves

_meta:
  config: textspanjepa_wikitext_base
  arm: standard_jepa
  note: "reference shape inherited from defaults.yaml; JAWP-only mechanism set"

meta:
  model_name: text_span_jepa_base

data:
  num_workers: 4

model:
  use_cgn: false
  # `lambda_swip` is zeroed next to the flag: any config that names a
  # mechanism must name its weight (tests/test_swip.py asserts this for
  # SWIP; no other mechanism has such a test yet). Inert today — with
  # `use_swip: false` the module is never constructed — and it stops a later
  # edit that flips the flag back from silently enabling SWIP at 0.01.

  use_swip: false
  lambda_swip: 0.0
  use_pcr: false
  use_spc: false
  use_wsd: false
  use_cmc: false
  use_gac: false
  use_sta: false
  use_puc: false
  use_rdc: false
  use_wsr: false

logging:
  folder: output/wikitext/base-140m/
