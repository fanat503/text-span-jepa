# MLM baseline -- small-100m rung of the WikiText-103 capacity ladder.
#
# Dims mirror the matching rung of config/scaling/ so the comparison is
# capacity-matched. Everything else is a genuine delta on defaults.yaml: the
# architecture block, the BERT-style single-token masking, this column's
# optimisation schedule, and the output folder.
#
# This file used to restate the entire GWP mechanism block (twelve `use_*`
# flags and nine `lambda_*` weights) and `predictor_embed_dim`. None of that
# reaches this baseline: `src.train.create_model` dispatches model_name=mlm /
# data2vec to `MLMBaseline` / `Data2VecTextBaseline` and never constructs a
# `TextSpanJEPAConfig`, so the keys were silently inert. They are gone.
#
# Effective batch is matched to the JEPA column at 512 sequences
# (data.batch_size 64 x optimization.grad_accum_steps 8, both inherited).
#
# Schedule note: the optimisation hyper-parameters below are this column's own
# (tuned per method, which is standard), but `epochs` differs between columns
# (JEPA 50, MLM 30, data2vec 50). The three methods therefore do not see the
# same token budget. That is a pre-existing protocol difference, not a config
# defect, and reconciling it is an experiment decision rather than a schema
# one -- see the STILL UNSOUND section of the config-system repair report.
#
# Guard: TestDeltaPurity, TestEveryConfigRuns

_meta:
  config: mlm_small
  arm: baseline_mlm

meta:
  model_name: mlm_small

data:
  mask_ratio: 0.15
  span_length_range: [1, 1]
  num_workers: 4

model:
  embed_dim: 640
  encoder_depth: 10
  num_heads: 10
  drop_rate: 0.1

optimization:
  epochs: 30
  lr: 0.0005
  start_lr: 0.0001
  weight_decay: 0.01
  final_weight_decay: 0.01

logging:
  folder: output/wikitext/mlm-small-100m/
