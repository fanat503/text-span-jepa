# Text-Span JEPA -- WikiText-103, small rung (capacity-matched to
# config/scaling/small_100m.yaml and to config/wikitext/mlm_wikitext_small.yaml
# / data2vec_wikitext_small.yaml).
#
# Arm: standard JEPA. defaults.yaml is the FULL GWP model, so "plain JEPA" is
# always eleven explicit `use_*: false` lines rather than an omission: a config
# that means to be a baseline says so out loud. The mechanism study is
# config/ablations/; this file is the capacity study.
#
# The pre-fix version of this file set `ema_tau_end: 1.0`, which
# `TextSpanJEPAConfig.validate()` rejects and which freezes the target encoder.
# The endpoint is now declared once, in defaults.yaml. It also restated the
# 640/10/10 shape here and in nine other files; that shape is a rung of the
# scaling ladder and is declared once, here.
#
# Effective batch is the inherited reference 64 x 8 = 512 sequences, which is
# what this rung used before (128 x 4) — same product, one place to change it.
#
# Guard: TestEveryConfigRuns, TestDeltaPurity, TestEMATargetStillMoves

_meta:
  config: textspanjepa_wikitext_small
  arm: standard_jepa
  note: "640/10/10 rung; the schedule and effective batch are inherited from defaults.yaml"

meta:
  model_name: text_span_jepa_small

data:
  num_workers: 4

model:
  embed_dim: 640
  encoder_depth: 10
  num_heads: 10
  predictor_embed_dim: 320
  predictor_depth: 4

  use_cgn: false
  # `lambda_swip` is zeroed next to the flag: any config that names a
  # mechanism must name its weight (tests/test_swip.py asserts this for
  # SWIP; no other mechanism has such a test yet). Inert today — with
  # `use_swip: false` the module is never constructed — and it stops a later
  # edit that flips the flag back from silently enabling SWIP at 0.01.

  use_swip: false
  lambda_swip: 0.0
  use_pcr: false
  use_spc: false
  use_wsd: false
  use_cmc: false
  use_gac: false
  use_sta: false
  use_puc: false
  use_rdc: false
  use_wsr: false

logging:
  folder: output/wikitext/small-100m/
