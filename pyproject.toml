[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "text-span-jepa"
version = "1.0.0rc15"
description = "Text-Span JEPA: Latent Predictive Learning for Language Representations"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [{name = "Text-Span JEPA Authors"}]
keywords = ["jepa", "self-supervised", "nlp", "representation-learning"]
dependencies = [
    "torch>=2.3.0",
    "numpy>=1.24.0,<3.0",
    "transformers>=4.30.0,<6.0",
    "datasets>=2.12.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1.0", "black>=24.0"]
eval = ["scikit-learn>=1.3.0", "matplotlib>=3.5"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py39"
lint.ignore = ["BLE001", "RUF059", "PLR0402", "S110", "S112", "RUF012", "RUF034", "B008", "I001", "F841", "RUF022"]
# `.agent-notes/` holds campaign scratch: the throwaway probe scripts a worker
# writes to take a measurement, plus the markdown reports. It is evidence, not
# source. Linting it produced 175 errors on wave 3 - all of them in
# `_probe_*.py` files that exist only to be run once - and reddened the gate for
# a change set whose actual source was clean. The reports are the durable
# artefact; the probes are not.
extend-exclude = [".agent-notes"]

[tool.black]
line-length = 100
target-version = ["py39"]
