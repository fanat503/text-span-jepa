# Text-Span JEPA defaults
# All configs inherit from these values — override in per-experiment YAML files
# Structure follows NextLat (Microsoft Research, 2025)
# C-JEPA best practice: explicit comments for every mechanism

seed: 42

meta:
  use_bfloat16: true
  load_checkpoint: false
  read_checkpoint: null
  model_name: text_span_jepa

data:
  batch_size: 64
  max_seq_len: 512
  tokenizer: gpt2
  num_workers: 2
  root_path: data/wikitext-103
  mask_ratio: 0.35
  span_length_range: [3, 10]

model:
  embed_dim: 768
  encoder_depth: 12
  num_heads: 12
  mlp_ratio: 4.0
  qkv_bias: true
  drop_rate: 0.0
  attn_drop_rate: 0.0
  drop_path_rate: 0.1
  gradient_checkpointing: false
  predictor_embed_dim: 384
  predictor_depth: 6
  future_offsets: [1, 4, 16]
  num_refine_steps: 3
  refine_step_size: 0.1
  decoder_bias: false
  variance_margin: 1.0
  centering_momentum: 0.9
  # EMA target encoder — cosine schedule from I-JEPA (Assran et al., 2023)
  ema_tau_start: 0.996
  ema_tau_end: 0.9999
  ema_schedule: cosine
  # Loss weights
  lambda_span: 1.0
  lambda_future: 0.5
  lambda_decoder: 0.1
  # VICReg-style collapse prevention (C-JEPA, NeurIPS 2024 Spotlight)
  lambda_variance: 0.1
  lambda_covariance: 0.04
  # Mask curriculum
  mask_ratio_start: 0.15
  mask_ratio_end: 0.35
  future_warmup_steps: 5000

  # ═══════════════════════════════════════════════════════════════
  #  Novel Mechanisms (all unified under WCP — proofs/unifying_principle.md)
  # ═══════════════════════════════════════════════════════════════

  # JAWP: Jacobian-Aligned Workspace Prediction (mechanism #1)
  # Courant-Fischer optimality — predicts in most-predictable subspace
  use_jawp: true
  jawk_k_start: 1
  jawk_k_end: null
  jawk_curriculum_steps: 10000
  jawk_alpha: 0.1
  jawk_init: identity
  # Predictive Rank Regularization (prevents workspace rank collapse)
  lambda_predictive_rank: 0.0

  # CGN: Contextual Gating Network (mechanism #6)
  # Partition of unity — routes information differently at masked/visible positions
  use_cgn: false
  cgn_n_groups: 8
  cgn_tau_start: 1.0
  cgn_tau_end: 0.1
  cgn_anneal_steps: 10000
  lambda_cgn_ortho: 0.0

  # SWIP: Selective Whitening with Information Preservation (mechanism #7)
  # Log-eigenvalue matching — VICReg = SWIP(k=0), SIGReg = SWIP(Gaussian target)
  use_swip: false
  swip_k_workspace: null
  swip_target_variance: 1.0
  lambda_swip: 0.0

  # PCR: Predictive Cascade Refinement (mechanism #8)
  # Cascade Capacity theorem — recovers info lost through bottleneck
  use_pcr: false
  pcr_n_levels: 3
  pcr_level_dims: null
  pcr_warmup_steps: 1000

  # SPC: Spectral Predictive Coding (mechanism #9)
  # Info-proportional capacity — allocates capacity per frequency band
  use_spc: false
  spc_n_bands: 8
  spc_init: dct
  lambda_spc: 0.0

  # WSD: Workspace-Target Synchronization Drift (mechanism #10)
  # Drift Bound theorem — prevents workspace-target desynchronization
  use_wsd: false
  wsd_k: null
  wsd_sync_interval: 100
  wsd_ema_beta: 0.99
  lambda_wsd: 0.0

  # CMC: Cross-Mask Consistency Regularization (mechanism #11)
  # Stability theorem (Cauchy-Schwarz) — predictions agree across masks
  use_cmc: false
  cmc_second_mask_ratio: null
  cmc_min_overlap_ratio: 0.2
  cmc_mode: interval
  cmc_interval: 10
  lambda_cmc: 0.0

  # GAC: Gradient-Allocated Capacity (mechanism #12)
  # No Dead Zones theorem — prevents gradient starvation
  use_gac: false
  gac_gamma: 0.01
  gac_tau_grad: 0.0001
  gac_warmup_steps: 1000
  lambda_gac: 0.0

  # STA: Spectral Transport Alignment (mechanism #13)
  # Davis-Kahan + Wasserstein-1 — stabilizes workspace spectral evolution
  use_sta: false
  sta_eta: 0.01
  sta_ema_beta: 0.999
  sta_warmup_steps: 500
  sta_update_interval: 10
  lambda_sta: 0.0

  # PUC: Prediction Uncertainty Calibration (mechanism #14)
  # Minimax optimality (Jaynes + Donsker-Varadhan) — prevents overconfidence
  use_puc: false
  puc_eta: 0.01
  puc_ema_beta: 0.999
  puc_warmup_steps: 500
  lambda_puc: 0.0

  # RDC: Representation Drift Compensation (mechanism #15)
  # Drift Compensation Bound — prevents loss of exogenous features (Pendharkar 2026)
  use_rdc: false
  rdc_eta: 0.01
  rdc_ema_beta: 0.999
  rdc_warmup_steps: 500
  rdc_k_workspace: null
  lambda_rdc: 0.0

  # WSR: Workspace Sharpness Regularization (mechanism #16)
  # Generalization Bound — prevents sharp workspace minima under distribution shift
  # PAC-Bayes + Grassmann Sharpness Decomposition: ρ_Q = ρ_spectral + ρ_directional
  use_wsr: false
  wsr_rho: 0.05
  wsr_eta: 0.01
  wsr_ema_beta: 0.999
  wsr_warmup_steps: 500
  wsr_mode: gradient
  lambda_wsr: 0.0

  # ═══════════════════════════════════════════════════════════════
  #  Collapse Prevention (from prior art, integrated into WCP)
  # ═══════════════════════════════════════════════════════════════

  # SIGReg: Sketched Isotropic Gaussian Regularization (LeJEPA, 2025)
  # Optimal embedding distribution — single hyperparameter
  lambda_sigreg: 0.0
  sigreg_n_sketches: 64
  sigreg_n_integration_points: 17
  sigreg_sigma: 1.0

  # J-Space: Workspace metrics (Anthropic, 2026)
  jspace_variance_threshold: 0.10
  jspace_k_workspace: 25

optimization:
  ema: [0.996, 0.9999]
  epochs: 50
  ipe_scale: 1.0
  lr: 0.001
  start_lr: 0.0002
  final_lr: 1.0e-5
  warmup: 10
  weight_decay: 0.04
  final_weight_decay: 0.4
  grad_accum_steps: 1

logging:
  folder: output/
  log_freq: 10
  write_tag: text_span_jepa
  keep_last_epoch_ckpts: null  # int K: prune older checkpoint-ep{N} files
